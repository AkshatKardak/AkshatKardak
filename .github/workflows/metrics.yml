name: Metrics
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1/2 - header (avatar, name, followers), repositories + languages
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AkshatKardak
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata

          # header    -> avatar, name and "Followed by N users"  (this is where followers come from)
          # repositories -> repository counts
          # metadata  -> misc account metadata
          # NOT included: activity (issues opened, issue comments, commits, PRs, reviews)
          # NOT included: community (following, organizations, sponsoring, starred)
          #               the whole community block is gone, followers are kept via header
          base: header, repositories, metadata

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_analysis_timeout: 15

      # 2/2 - contribution calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AkshatKardak
          template: classic
          filename: github-metrics-calendar.svg
          config_timezone: Asia/Kolkata
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

